name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, private keys or confidential repository content.
        For a security problem use [private reporting](../security/advisories/new), not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with ...
        2. Click ...
        3. The window shows ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the output of `git describe --tags` in the source tree.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - .deb package
        - Local install script (build/install-local.sh)
        - From source (npm start)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: Ubuntu 24.04, GNOME 46, Wayland
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      description: Terminal output, the notification the app showed, or a screenshot. Remove anything confidential.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open issues and this is not a duplicate.
          required: true
        - label: This is not a security report (those go through private reporting).
          required: true
