name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # I test di integrazione eseguono il vero binario `git` su repository temporanei.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Smoke: il benchmark deve girare, non deve essere veloce. I numeri veri si misurano in locale.
      - name: Benchmark smoke
        run: npm run bench -- --commits 300 --files 400

  windows:
    name: Typecheck, test, build (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Il test suite confronta il contenuto dei file: su Windows Git converte in CRLF al checkout
      # se `core.autocrlf` è attivo, e i confronti fallirebbero per un motivo che non è del programma.
      - name: Git deterministico
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false

      # Su Windows il terminale, l'askpass e l'editor del rebase passano dal bash di Git per
      # Windows: questi passi sono la verifica che il porting regga, non solo che compili.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: npm test

      - name: Build
        run: npm run build

      # Il pacchetto per Windows si costruisce qui, non su una macchina Linux, e viene avviato:
      # così l'eseguibile pubblicato è almeno una volta partito davvero.
      - name: Pacchetto Windows
        shell: bash
        run: npm run windows

      - name: Avvio del pacchetto
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/GitHandler-*-win32-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath smoke
          $exe = Get-ChildItem smoke -Recurse -Filter GitHandler.exe | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -PassThru -ArgumentList '--ozone-platform=headless','--disable-gpu'
          Start-Sleep -Seconds 20
          if ($process.HasExited) {
            Write-Error "GitHandler è uscito subito con codice $($process.ExitCode)"
          } else {
            Stop-Process -Id $process.Id -Force
            Write-Host "GitHandler è vivo dopo 20 secondi"

      # Il pacchetto che supera l'avvio è quello che si pubblica: si scarica da qui.
      - name: Pacchetto verificato
        uses: actions/upload-artifact@v4
        with:
          name: githandler-win32-x64
          path: release/GitHandler-*-win32-x64.zip
          if-no-files-found: error
          }
